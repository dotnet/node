trigger:
  batch: true
  branches:
    include:
    - dotnet/main
    - dotnet/release/*

pr: none

variables:
- template: /eng/common-variables.yml@self
- template: /eng/common/templates-official/variables/pool-providers.yml@self
  # prevent UsePythonVersion@0 from accessing pypi.org
- name: PIP_INDEX_URL
  value: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-pypi/pypi/simple/
# Attribute mirrored source to GitHub without changing the build checkout.
- ${{ if and(eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.Repository.Name'], 'dotnet-node')) }}:
  - name: Codeql.ADO.Build.Repository.Provider
    value: GitHub
  - name: Codeql.ADO.Build.Repository.Uri
    value: https://github.com/dotnet/node
  - name: Codeql.ADO.Build.SourceBranchName
    value: $[replace(variables['Build.SourceBranch'], 'refs/heads/', '')]

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
- name: linuxBuilds
  type: object
  default:
  - arch: x64
    assetManifestOS: linux
    imagename: linux_x64
    rootfsDir: /crossrootfs/x64
  - arch: arm64
    assetManifestOS: linux
    imagename: linux_arm64
    rootfsDir: /crossrootfs/arm64
  - arch: x64
    assetManifestOS: linux-musl
    imagename: linux_musl_x64
    rootfsDir: /crossrootfs/x64
  - arch: arm64
    assetManifestOS: linux-musl
    imagename: linux_musl_arm64
    rootfsDir: /crossrootfs/arm64
- name: macBuilds
  type: object
  default:
  - arch: x64
  - arch: arm64
- name: windowsBuilds
  type: object
  default:
  - arch: x64
  - arch: arm64

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      tsa:
        enabled: true
      policheck:
        enabled: true
        exclusionsFile: $(Build.SourcesDirectory)\.config\PoliCheckExclusions.xml
      eslint:
        enableExclusions: true
        exclusionPatterns: |
          **/deps/**
          **/test/**
      credscan:
        suppressionsFile: $(Build.SourcesDirectory)/.config/CredScanSuppressions.json
      binskim:
        enabled: true
        scanOutputDirectoryOnly: true
      sourceAnalysisPool:
        name: $(DncEngInternalBuildPool)
        image: 1es-windows-2022
        os: windows
    containers:
      linux_x64:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-amd64
      linux_arm64:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-arm64
      linux_musl_x64:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-amd64-musl
      linux_musl_arm64:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-arm64-musl
    stages:
    - stage: build
      displayName: Build
      jobs:
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enablePublishBuildArtifacts: true
          enablePublishBuildAssets: true
          publishingVersion: 4
          jobs:

          ############ LINUX BUILD ############
          - ${{ each buildjob in parameters.linuxBuilds }}:
            - job: Build_${{ replace(buildjob.assetManifestOS, '-', '_') }}_${{ buildjob.arch }}
              enablePublishing: true
              displayName: ${{ buildjob.assetManifestOS }} ${{ buildjob.arch }}
              timeoutInMinutes: 600
              pool:
                name: $(DncEngInternalBuildPool)
                image: build.azurelinux.3.amd64
                os: linux
              container: ${{ buildjob.imagename }}
              steps:
              - script: |
                  git clean -ffdx
                  git reset --hard HEAD
                displayName: 'Clean up working directory'

              - bash: |
                  ./build.sh --ci --restore --build --pack --arch ${{ buildjob.arch }} --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:ClangBinDir=/usr/local/bin/  /p:RestoreUsingNuGetTargets=false /p:OutputRid=${{ buildjob.assetManifestOS }}-${{ buildjob.arch }}
                displayName: 'Build and package'
                env:
                  ROOTFS_DIR: ${{ buildjob.rootfsDir }}

              - bash: ./eng/common/build.sh --ci --restore --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:AssetManifestOS=${{ buildjob.assetManifestOS }} /p:PlatformName=${{ buildjob.arch }} --projects $(Build.SourcesDirectory)/node.proj
                displayName: Publish packages
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          ############ MACOS BUILD ############
          - ${{ each buildjob in parameters.macBuilds }}:
            - job: Build_macOS_${{ buildjob.arch }}
              enablePublishing: true
              displayName: macOS ${{ buildjob.arch }}
              timeoutInMinutes: 600
              pool:
                name: Azure Pipelines
                image: macos-15
                os: macOS
              steps:
              - script: |
                  git clean -ffdx
                  git reset --hard HEAD
                displayName: 'Clean up working directory'

              - bash: |
                  ./build.sh --ci --restore --build --pack --arch ${{ buildjob.arch }} --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:RestoreUsingNuGetTargets=false /p:NodeBuildParallelism=4
                displayName: 'Build and package'

              - bash: ./eng/common/build.sh --ci --restore --publish --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:AssetManifestOS=osx /p:PlatformName=${{ buildjob.arch }} --projects $(Build.SourcesDirectory)/node.proj
                displayName: Publish packages
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

          ############ WINDOWS BUILD ############
          - ${{ each buildjob in parameters.windowsBuilds }}:
            - job: Build_Windows_${{ buildjob.arch }}
              enablePublishing: true
              displayName: Windows ${{ buildjob.arch }}
              timeoutInMinutes: 600
              pool:
                name: $(DncEngInternalBuildPool)
                image: windows.vs2022.amd64
                os: windows
              steps:
              - script: |
                  git clean -ffdx
                  git reset --hard HEAD
                displayName: 'Clean up working directory'

              # nodejs configure needs python 3.11
              - task: UsePythonVersion@0
                inputs:
                  versionSpec: '3.11'
                  addToPath: true

              - powershell: eng\build.ps1 -ci -restore -build -pack -arch ${{ buildjob.arch }} -configuration $(_BuildConfig) $(_InternalBuildArgs) /p:RestoreUsingNuGetTargets=false
                displayName: 'Build and package'

              - powershell: eng\common\build.ps1 -ci -restore -publish -configuration $(_BuildConfig) $(_InternalBuildArgs) /p:AssetManifestOS=win /p:PlatformName=${{ buildjob.arch }} -projects $(Build.SourcesDirectory)\node.proj
                displayName: Publish packages
                condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))

    ############ POST BUILD ARCADE LOGIC ############
    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        publishingInfraVersion: 4
        enableSourceLinkValidation: false
        enableSigningValidation: false
        enableSymbolValidation: false
        enableNugetValidation: true
