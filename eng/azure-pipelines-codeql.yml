# Create this pipeline in `dnceng/internal` against the GitHub repository
# `dotnet/node` so GitHub-attributed CodeQL snapshots stay separate from the
# existing ADO-mirror pipeline in `eng/azure-pipelines.yml`.

trigger:
  batch: true
  branches:
    include:
    - dotnet/main

pr: none

schedules:
- cron: 0 0 * * 0
  displayName: Weekly CodeQL refresh
  branches:
    include:
    - dotnet/main
  always: true

variables:
- template: /eng/common-variables.yml@self
- template: /eng/common/templates-official/variables/pool-providers.yml@self
- name: PIP_INDEX_URL
  value: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-public-pypi/pypi/simple/

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      codeql:
        compiled:
          enabled: true
        runSourceLanguagesInSourceAnalysis: true
        sourceLanguages: javascript
        binaryLanguages: cpp
      sourceAnalysisPool:
        name: $(DncEngInternalBuildPool)
        image: 1es-windows-2022
        os: windows
    containers:
      linux_x64:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-amd64
    stages:
    - stage: build
      displayName: CodeQL
      jobs:
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          jobs:
          - job: Build_Linux_x64
            displayName: Linux x64
            timeoutInMinutes: 600
            pool:
              name: $(DncEngInternalBuildPool)
              image: build.azurelinux.3.amd64
              os: linux
            container: linux_x64
            steps:
            - script: |
                git clean -ffdx
                git reset --hard HEAD
              displayName: Clean up working directory

            - bash: |
                ./build.sh --ci --restore --build --pack --arch x64 --configuration $(_BuildConfig) $(_InternalBuildArgs) /p:ClangBinDir=/usr/local/bin/ /p:RestoreUsingNuGetTargets=false
              displayName: Build and package
              env:
                ROOTFS_DIR: /crossrootfs/x64
